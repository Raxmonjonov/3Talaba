# ==============================================================================
# 3Talaba Campus — High-Concurrency & Zero-Freeze Nginx Main Configuration
# Faqat 443/tcp (TLS 1.3 / HTTP2) orqali shifrlangan kirish uchun optimallashgan
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    use epoll;
    worker_connections 16384;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Server versiyasini yashirish (Xavfsizlik)
    server_tokens off;

    # Yuqori trafikda I/O va TCP paketlarni tezlashtirish (Zero-Freeze)
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30s;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Slowloris va paket to'ldirish hujumlaridan himoya
    client_body_buffer_size     16k;
    client_header_buffer_size   2k;
    client_max_body_size        10m;
    large_client_header_buffers 4 8k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    reset_timedout_connection   on;

    # Tezkor Gzip siqish (CPU ni qiynamasdan trafikni 70% ga kamaytiradi)
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # DDoS va Brute-Force himoya zonalari (RAM asosida O(1) tekshiruv)
    limit_req_zone  $binary_remote_addr zone=page_limit:20m rate=40r/s;
    limit_req_zone  $binary_remote_addr zone=api_limit:20m  rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth_ai_limit:20m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;

    # Yuqori trafik (10,000+ bir vaqtdagi o'quvchi) uchun Microcache xotirasi
    proxy_cache_path /var/cache/nginx/3talaba
        levels=1:2
        keys_zone=microcache:64m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    # Tizimga kirgan o'quvchilarning shaxsiy ma'lumotlari keshlanmasligi uchun filtr
    map $http_cookie $skip_microcache {
        default                                   0;
        "~*next-auth\.session-token"              1;
        "~*__Secure-next-auth\.session-token"     1;
    }

    log_format main_compact '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                            'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                            'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main_compact buffer=64k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/conf.d/*.conf;
}
