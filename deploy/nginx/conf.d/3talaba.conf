# ==============================================================================
# 3Talaba Campus — Strict 443/TCP TLS-Only Virtual Host & Anti-Freeze Proxy
# DIQQAT: 80-port va boshqa barcha tashqi portlar tinglanmaydi — faqat 443/tcp!
# ==============================================================================

upstream nextjs_cluster {
    least_conn;
    # Docker muhitida `app:3000`, bare-metal Linux VPS da `127.0.0.1:3000` ishlatiladi:
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

# Noma'lum Host (IP orqali to'g'ridan-to'g'ri skanerlash) so'rovlarini SSL handshake bosqichidayoq uzish
# `reuseport` soket darajasida aynan `default_server` blokida e'lon qilinadi va barcha 443 serverlarga ishlaydi
server {
    listen 443 ssl reuseport default_server;
    listen [::]:443 ssl reuseport default_server;
    server_name _;

    ssl_reject_handshake on;
}

# Asosiy Shifrlangan Production Server (Faqat 443/tcp)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Domen nomingizni shu yerda belgilang:
    server_name 3talaba.uz www.3talaba.uz;

    # ==========================================================================
    # 1. KRIPTOGRAFIK HIMOYA (TLS 1.3 + Kuchli AEAD Shifrlash)
    # ==========================================================================
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (SSL tekshiruvini tezlashtiradi)
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ==========================================================================
    # 2. XAVFSIZLIK HEADERLARI (HSTS + XSS/Clickjacking Himoyasi)
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=(), payment=()" always;

    # Har bir IP uchun bir vaqtdagi maksimal ulanishlar soni
    limit_conn conn_per_ip 40;

    # Yashirin tizim fayllarini bloklash (.env, .git va h.k.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # 3. STATIK RESURSLARNI NGINX XOTIRASIDAN 0ms DA UZATISH (Node.js yuklamasiz)
    # ==========================================================================
    location /_next/static/ {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache microcache;
        proxy_cache_valid 200 365d;
        proxy_ignore_headers Set-Cookie Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;
    }

    # ==========================================================================
    # 4. AUTH VA AI ENDPOINTLAR (Qat'iy Rate-Limit + Streaming Qo'llab-quvvatlash)
    # ==========================================================================
    location ~ ^/api/(auth|ai)/ {
        limit_req zone=auth_ai_limit burst=12 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ==========================================================================
    # 5. UMUMIY API YO'NALISHLARI (Yuqori oqimga chidamli Keepalive + Kesh)
    # ==========================================================================
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache microcache;
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $skip_microcache;
        proxy_no_cache $skip_microcache;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    }

    # ==========================================================================
    # 6. ASOSIY SAHIFALAR (Stampede-Proof Microcaching — Sayt hech qachon qotmaydi!)
    # ==========================================================================
    location / {
        limit_req zone=page_limit burst=80 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Bir vaqtda 10,000 ta o'quvchi kirganda ham Node.js ga 1 ta so'rov o'tadi,
        # qolgan 9,999 tasi Nginx RAM keshidan <1ms ichida javob oladi!
        proxy_cache microcache;
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $skip_microcache;
        proxy_no_cache $skip_microcache;
        proxy_cache_valid 200 10s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
